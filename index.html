<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#0A2540" />
<title>Nexo — Abertura de Conta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN SYSTEM (Baseado em Tailwind / Fintech Premium)
   ============================================================ */
:root {
  --navy-900: #04101F;
  --navy-700: #0A2540;
  --navy-500: #163A6B;
  --blue-500: #1E62F0;
  --blue-100: #E5EDFF;
  --bg: #F8FAFC;
  --surface: #FFFFFF;
  --text: #0A2540;
  --text-dim: #64748B;
  --text-mute: #94A3B8;
  --border: #E2E8F0;
  --success: #12B76A;
  --danger: #F04438;
  --warn: #F79009;
  --radius: 12px;
  --radius-lg: 16px;
  --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
  --transition: 300ms cubic-bezier(0.4, 0, 0.2, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  display: flex;
  justify-content: center;
  height: 100dvh;
}

#app {
  width: 100%;
  max-width: 480px;
  background: var(--surface);
  height: 100%;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 40px rgba(0,0,0,0.05);
}

/* ============================================================
   ANIMAÇÕES (Framer Motion Style)
   ============================================================ */
.fade-in { animation: fadeIn 0.4s ease-out forwards; }
.slide-in { animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
.slide-out { animation: slideOut 0.3s ease-in forwards; }
.pop-in { animation: popIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
.pulse { animation: pulse 2s infinite; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
@keyframes slideOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(-30px); } }
@keyframes popIn { 0% { opacity: 0; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes drawCheck { to { stroke-dashoffset: 0; } }

/* ============================================================
   COMPONENTES UI
   ============================================================ */
.header {
  padding: 24px 24px 16px;
  display: flex;
  align-items: center;
  gap: 16px;
  background: var(--surface);
  z-index: 10;
}
.btn-back {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: transparent;
  display: grid; place-items: center;
  cursor: pointer;
  transition: var(--transition);
}
.btn-back:active { background: var(--bg); transform: scale(0.95); }
.btn-back svg { width: 20px; height: 20px; color: var(--text); }

.progress-container { flex: 1; }
.progress-text {
  font-size: 12px; font-weight: 600; color: var(--text-dim);
  margin-bottom: 8px; display: flex; justify-content: space-between;
}
.progress-bar {
  height: 4px; background: var(--border); border-radius: 4px; overflow: hidden;
}
.progress-fill {
  height: 100%; background: var(--blue-500); width: 0%;
  transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.content {
  flex: 1; padding: 12px 24px 24px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  display: flex; flex-direction: column;
}

.title { font-size: 24px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.5px; }
.subtitle { font-size: 14px; color: var(--text-dim); margin-bottom: 24px; line-height: 1.5; }

.input-group { margin-bottom: 16px; position: relative; }
.input-group label {
  display: block; font-size: 13px; font-weight: 600; color: var(--text-dim);
  margin-bottom: 6px;
}
.input-wrapper {
  position: relative; display: flex; align-items: center;
}
.input-wrapper svg {
  position: absolute; left: 16px; width: 20px; height: 20px; color: var(--text-mute);
  pointer-events: none; transition: var(--transition);
}
.input-wrapper input, .input-wrapper select {
  width: 100%; padding: 16px 16px 16px 48px;
  border: 1.5px solid var(--border); border-radius: var(--radius);
  font-size: 16px; color: var(--text); background: var(--surface);
  transition: var(--transition); outline: none;
  font-family: 'Inter', sans-serif; font-weight: 500;
  appearance: none;
}
.input-wrapper input::placeholder { color: var(--text-mute); font-weight: 400; }
.input-wrapper input:focus, .input-wrapper select:focus {
  border-color: var(--blue-500);
  box-shadow: 0 0 0 4px rgba(30, 98, 240, 0.1);
}
.input-wrapper input:focus + svg { color: var(--blue-500); }
.input-wrapper.error input { border-color: var(--danger); }
.input-wrapper.error + .error-msg { display: block; }
.error-msg { color: var(--danger); font-size: 12px; margin-top: 6px; display: none; font-weight: 500; }

.row { display: flex; gap: 12px; }
.row > .input-group { flex: 1; }

.btn {
  width: 100%; padding: 16px; border-radius: var(--radius);
  font-size: 16px; font-weight: 600; cursor: pointer;
  transition: var(--transition); border: none;
  display: flex; justify-content: center; align-items: center; gap: 8px;
  font-family: 'Inter', sans-serif; margin-top: auto;
}
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--navy-700); color: white; }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary:hover { background: var(--navy-900); }
.btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
.btn-outline:hover { background: var(--bg); }
.btn svg { width: 20px; height: 20px; }

/* Tela de boas vindas */
.welcome-screen {
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  height: 100%; text-align: center; padding: 24px;
  background: var(--navy-700); color: white; position: absolute; inset: 0; z-index: 50;
}
.welcome-logo {
  width: 80px; height: 80px; background: white; border-radius: 20px;
  display: grid; place-items: center; margin-bottom: 32px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2); color: var(--navy-700);
}
.welcome-logo svg { width: 40px; height: 40px; }
.welcome-title { font-size: 32px; font-weight: 800; margin-bottom: 12px; letter-spacing: -1px; }
.welcome-subtitle { font-size: 16px; color: rgba(255,255,255,0.8); margin-bottom: 48px; line-height: 1.5; }
.welcome-actions { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 12px; }
.welcome-actions .btn-primary { background: white; color: var(--navy-700); }
.welcome-actions .btn-primary:hover { background: #f0f0f0; }
.welcome-actions .btn-outline { border-color: rgba(255,255,255,0.3); color: white; }
.welcome-actions .btn-outline:hover { background: rgba(255,255,255,0.1); }

/* OTP */
.otp-container { display: flex; gap: 8px; justify-content: center; margin: 24px 0; }
.otp-input {
  width: 48px; height: 56px; text-align: center; font-size: 24px; font-weight: 700;
  border: 1.5px solid var(--border); border-radius: var(--radius);
  background: var(--bg); color: var(--text);
}
.otp-input:focus { border-color: var(--blue-500); background: white; outline: none; }

/* Uploads */
.upload-box {
  border: 2px dashed var(--border); border-radius: var(--radius-lg);
  padding: 32px 16px; text-align: center; cursor: pointer;
  transition: var(--transition); background: var(--bg);
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  margin-bottom: 16px;
}
.upload-box:hover { border-color: var(--blue-500); background: var(--blue-100); }
.upload-box svg { width: 32px; height: 32px; color: var(--blue-500); }
.upload-box span { font-size: 14px; font-weight: 600; color: var(--text); }
.upload-box small { font-size: 12px; color: var(--text-dim); }
.upload-box input[type="file"] { display: none; }
.upload-preview { width: 100%; height: 160px; object-fit: cover; border-radius: var(--radius); display: none; margin-top: 12px; }

/* Câmera / Selfie */
.camera-sim {
  width: 100%; aspect-ratio: 3/4; background: #000; border-radius: var(--radius-lg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  position: relative; overflow: hidden; margin-bottom: 16px;
}
.camera-oval {
  width: 65%; aspect-ratio: 3/4; border: 3px solid rgba(255,255,255,0.5);
  border-radius: 50%; position: absolute; top: 15%;
  box-shadow: 0 0 0 1000px rgba(0,0,0,0.5);
}

/* Medidor de senha */
.password-strength { display: flex; gap: 4px; margin-top: 8px; height: 4px; }
.strength-bar { flex: 1; background: var(--border); border-radius: 4px; transition: var(--transition); }
.strength-bar.active.weak { background: var(--danger); }
.strength-bar.active.medium { background: var(--warn); }
.strength-bar.active.strong { background: var(--success); }

/* Revisão */
.review-card { background: var(--bg); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
.review-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
.review-row:last-child { border-bottom: none; }
.review-row span { color: var(--text-dim); }
.review-row strong { font-weight: 600; text-align: right; max-width: 60%; }

/* Sucesso */
.success-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; height: 100%; }
.check-circle { width: 80px; height: 80px; border-radius: 50%; background: rgba(18,183,106,0.1); display: grid; place-items: center; margin-bottom: 24px; }
.check-circle svg { width: 40px; height: 40px; stroke: var(--success); stroke-dasharray: 50; stroke-dashoffset: 50; animation: drawCheck 1s ease-out forwards; }
.protocol-badge { background: var(--bg); border: 1px solid var(--border); padding: 12px 24px; border-radius: 100px; font-size: 16px; font-weight: 700; margin: 16px 0; letter-spacing: 1px; }

/* Utilitários */
.hidden { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <!-- TELA DE BOAS VINDAS -->
  <div class="welcome-screen fade-in" id="screen-welcome">
    <div class="welcome-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/></svg>
    </div>
    <h1 class="welcome-title">Abra sua conta</h1>
    <p class="welcome-subtitle">Sua nova conta digital gratuita, segura e pronta em minutos.</p>
    
    <div class="welcome-actions">
      <button class="btn btn-primary" onclick="startOnboarding()">Começar agora</button>
      <button class="btn btn-outline" onclick="alert('Redirecionando para login...')">Já tenho uma conta</button>
    </div>
    <p style="font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 24px;">
      Ao continuar você aceita nossos <br> 
      <a href="#" style="color:white; text-decoration: underline;">Termos de Uso</a> e <a href="#" style="color:white; text-decoration: underline;">Política de Privacidade</a>.
    </p>
  </div>

  <!-- HEADER (Aparece durante o onboarding) -->
  <div class="header hidden" id="app-header">
    <button class="btn-back" onclick="prevStep()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="progress-container">
      <div class="progress-text">
        <span id="step-name">Dados Pessoais</span>
        <span id="step-counter">Passo 1 de 6</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>
  </div>

  <!-- CONTEÚDO DINÂMICO -->
  <div class="content hidden" id="app-content">
    <!-- O JS injeta o HTML dos formulários aqui -->
  </div>
</div>

<script>
/* ============================================================
   ESTADO GLOBAL E CONFIGURAÇÃO
   ============================================================ */
const state = {
  step: 0,
  data: {
    name: '', cpf: '', birthdate: '', nationality: 'Brasileira', country: 'Brasil',
    email: '', phone: '', ddd: '',
    cep: '', address: '', addressNum: '', addressComp: '', neighborhood: '', city: '', uf: '',
    docType: '', docFront: null, docBack: null,
    selfie: false,
    password: '',
    terms: false
  }
};

const stepsConfig = [
  { id: 'personal', name: 'Dados Pessoais' },
  { id: 'contact', name: 'Contatos' },
  { id: 'address', name: 'Endereço' },
  { id: 'document', name: 'Documentos' },
  { id: 'selfie', name: 'Reconhecimento Facial' },
  { id: 'password', name: 'Segurança' },
  { id: 'review', name: 'Revisão' }
];

/* ============================================================
   CONTROLE DE NAVEGAÇÃO
   ============================================================ */
function startOnboarding() {
  document.getElementById('screen-welcome').classList.add('hidden');
  document.getElementById('app-header').classList.remove('hidden');
  document.getElementById('app-content').classList.remove('hidden');
  state.step = 0;
  renderStep();
}

function updateHeader() {
  const config = stepsConfig[state.step];
  document.getElementById('step-name').textContent = config.name;
  document.getElementById('step-counter').textContent = `Passo ${state.step + 1} de ${stepsConfig.length}`;
  const pct = ((state.step + 1) / stepsConfig.length) * 100;
  document.getElementById('progress-fill').style.width = `${pct}%`;
}

function prevStep() {
  if (state.step > 0) {
    state.step--;
    renderStep();
  } else {
    document.getElementById('screen-welcome').classList.remove('hidden');
    document.getElementById('app-header').classList.add('hidden');
    document.getElementById('app-content').classList.add('hidden');
  }
}

function nextStep() {
  if (validateCurrentStep()) {
    if (state.step < stepsConfig.length - 1) {
      state.step++;
      renderStep();
    } else {
      submitApplication();
    }
  }
}

/* ============================================================
   RENDERIZAÇÃO DAS TELAS (ETAPAS)
   ============================================================ */
function renderStep() {
  updateHeader();
  const container = document.getElementById('app-content');
  
  // Animação de saída
  container.classList.remove('slide-in');
  container.classList.add('slide-out');
  
  setTimeout(() => {
    container.innerHTML = '';
    const config = stepsConfig[state.step];
    
    if (config.id === 'personal') renderPersonal(container);
    if (config.id === 'contact') renderContact(container);
    if (config.id === 'address') renderAddress(container);
    if (config.id === 'document') renderDocument(container);
    if (config.id === 'selfie') renderSelfie(container);
    if (config.id === 'password') renderPassword(container);
    if (config.id === 'review') renderReview(container);

    // Animação de entrada
    container.classList.remove('slide-out');
    container.classList.add('slide-in');
    container.scrollTop = 0;
  }, 300);
}

/* ============================================================
   ETAPA 1: DADOS PESSOAIS
   ============================================================ */
function renderPersonal(c) {
  c.innerHTML = `
    <h2 class="title">Seus dados</h2>
    <p class="subtitle">Precisamos dessas informações para criar sua conta.</p>
    
    <div class="input-group">
      <label>Nome completo</label>
      <div class="input-wrapper">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <input type="text" id="inp-name" placeholder="Ex: João da Silva" value="${state.data.name}" oninput="state.data.name = this.value">
      </div>
      <div class="error-msg" id="err-name">Informe seu nome completo.</div>
    </div>

    <div class="input-group">
      <label>CPF</label>
      <div class="input-wrapper">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h10M7 16h5"/></svg>
        <input type="tel" id="inp-cpf" placeholder="000.000.000-00" maxlength="14" value="${state.data.cpf}" oninput="maskCPF(this)">
      </div>
      <div class="error-msg" id="err-cpf">CPF inválido.</div>
    </div>

    <div class="input-group">
      <label>Data de nascimento</label>
      <div class="input-wrapper">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <input type="date" id="inp-birth" value="${state.data.birthdate}" onchange="state.data.birthdate = this.value">
      </div>
      <div class="error-msg" id="err-birth">Você precisa ter 18 anos ou mais.</div>
    </div>

    <div class="row">
      <div class="input-group">
        <label>Nacionalidade</label>
        <div class="input-wrapper">
          <select onchange="state.data.nationality = this.value">
            <option value="Brasileira" ${state.data.nationality === 'Brasileira' ? 'selected' : ''}>Brasileira</option>
            <option value="Portuguesa">Portuguesa</option>
            <option value="Outra">Outra</option>
          </select>
        </div>
      </div>
      <div class="input-group">
        <label>País de residência</label>
        <div class="input-wrapper">
          <select onchange="state.data.country = this.value">
            <option value="Brasil" ${state.data.country === 'Brasil' ? 'selected' : ''}>Brasil</option>
            <option value="Portugal">Portugal</option>
          </select>
        </div>
      </div>
    </div>

    <button class="btn btn-primary" onclick="nextStep()">Continuar</button>
  `;
}

function maskCPF(input) {
  let v = input.value.replace(/\D/g, '');
  if (v.length > 11) v = v.slice(0, 11);
  v = v.replace(/(\d{3})(\d)/, '$1.$2');
  v = v.replace(/(\d{3})(\d)/, '$1.$2');
  v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
  input.value = v;
  state.data.cpf = v;
}

/* ============================================================
   ETAPA 2: CONTATOS E OTP
   ============================================================ */
function renderContact(c) {
  c.innerHTML = `
    <h2 class="title">Como podemos falar com você?</h2>
    <p class="subtitle">Enviaremos um código para confirmar seus dados.</p>
    
    <div class="input-group">
      <label>E-mail</label>
      <div class="input-wrapper">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        <input type="email" id="inp-email" placeholder="voce@email.com" value="${state.data.email}" oninput="state.data.email = this.value">
      </div>
      <div class="error-msg" id="err-email">Digite um e-mail válido.</div>
    </div>

    <div class="row">
      <div class="input-group" style="flex: 0.4;">
        <label>DDD</label>
        <div class="input-wrapper">
          <input type="tel" id="inp-ddd" placeholder="11" maxlength="2" value="${state.data.ddd}" oninput="state.data.ddd = this.value">
        </div>
      </div>
      <div class="input-group" style="flex: 1.6;">
        <label>Celular</label>
        <div class="input-wrapper">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg>
          <input type="tel" id="inp-phone" placeholder="99999-9999" maxlength="10" value="${state.data.phone}" oninput="maskPhone(this)">
        </div>
        <div class="error-msg" id="err-phone">Celular inválido.</div>
      </div>
    </div>

    <button class="btn btn-primary" onclick="nextStep()">Continuar</button>
  `;
}

function maskPhone(input) {
  let v = input.value.replace(/\D/g, '');
  if (v.length > 11) v = v.slice(0, 11);
  v = v.replace(/(\d{5})(\d)/, '$1-$2');
  input.value = v;
  state.data.phone = v;
}

/* ============================================================
   ETAPA 3: ENDEREÇO (VIA CEP API REAL)
   ============================================================ */
function renderAddress(c) {
  c.innerHTML = `
    <h2 class="title">Onde você mora?</h2>
    <p class="subtitle">Precisamos do seu endereço residencial.</p>
    
    <div class="input-group">
      <label>CEP</label>
      <div class="input-wrapper">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <input type="tel" id="inp-cep" placeholder="00000-000" maxlength="9" value="${state.data.cep}" oninput="maskCEP(this)" onblur="fetchCEP()">
      </div>
      <div class="error-msg" id="err-cep">CEP inválido.</div>
      <div id="cep-loading" style="display:none; font-size:12px; color:var(--blue-500); margin-top:4px;">Buscando endereço...</div>
    </div>

    <div class="input-group">
      <label>Rua / Logradouro</label>
      <div class="input-wrapper">
        <input type="text" id="inp-address" placeholder="Av. Paulista" value="${state.data.address}" oninput="state.data.address = this.value">
      </div>
    </div>

    <div class="row">
      <div class="input-group">
        <label>Número</label>
        <div class="input-wrapper">
          <input type="text" id="inp-addressNum" placeholder="123" value="${state.data.addressNum}" oninput="state.data.addressNum = this.value">
        </div>
      </div>
      <div class="input-group">
        <label>Complemento</label>
        <div class="input-wrapper">
          <input type="text" placeholder="Apto 45" value="${state.data.addressComp}" oninput="state.data.addressComp = this.value">
        </div>
      </div>
    </div>

    <div class="input-group">
      <label>Bairro</label>
      <div class="input-wrapper">
        <input type="text" id="inp-neighborhood" placeholder="Bela Vista" value="${state.data.neighborhood}" oninput="state.data.neighborhood = this.value">
      </div>
    </div>

    <div class="row">
      <div class="input-group">
        <label>Cidade</label>
        <div class="input-wrapper">
          <input type="text" id="inp-city" placeholder="São Paulo" value="${state.data.city}" oninput="state.data.city = this.value">
        </div>
      </div>
      <div class="input-group" style="flex: 0.4;">
        <label>UF</label>
        <div class="input-wrapper">
          <input type="text" id="inp-uf" placeholder="SP" maxlength="2" value="${state.data.uf}" oninput="state.data.uf = this.value">
        </div>
      </div>
    </div>

    <button class="btn btn-primary" onclick="nextStep()">Continuar</button>
  `;
}

function maskCEP(input) {
  let v = input.value.replace(/\D/g, '');
  if (v.length > 8) v = v.slice(0, 8);
  v = v.replace(/(\d{5})(\d)/, '$1-$2');
  input.value = v;
  state.data.cep = v;
}

async function fetchCEP() {
  const cep = state.data.cep.replace(/\D/g, '');
  if (cep.length !== 8) return;
  
  document.getElementById('cep-loading').style.display = 'block';
  try {
    const res = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
    const data = await res.json();
    if (!data.erro) {
      document.getElementById('inp-address').value = data.logradouro;
      document.getElementById('inp-neighborhood').value = data.bairro;
      document.getElementById('inp-city').value = data.localidade;
      document.getElementById('inp-uf').value = data.uf;
      
      state.data.address = data.logradouro;
      state.data.neighborhood = data.bairro;
      state.data.city = data.localidade;
      state.data.uf = data.uf;
      
      document.getElementById('inp-addressNum').focus();
    }
  } catch (e) {
    console.error('Erro ao buscar CEP');
  } finally {
    document.getElementById('cep-loading').style.display = 'none';
  }
}

function handleUpload(input, dataKey, previewId) {
  const file = input.files[0];

      document.getElementById(previewId).src = e.target.result;
      document.getElementById(previewId).style.display = 'block';
      state.data[dataKey] = true; // Flag indicando que foi enviado
      
      // Atualiza visual do card

      input.parentElement.style.background = 'rgba(18,183,106,0.05)';
    };
    reader.readAsDataURL(file);
  }
}

function renderPassword(c) {
  c.innerHTML = `

    <div class="input-group">

        <input type="password" id="inp-pwd" placeholder="Digite sua senha" oninput="checkStrength(this.value)">
        <button onclick="togglePwd()" style="position:absolute;right:16px;background:none;border:none;cursor:pointer;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px;color:var(--text-mute);"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="password-strength">
        <div class="strength-bar" id="bar-1"></div>
        <div class="strength-bar" id="bar-2"></div>
        <div class="strength-bar" id="bar-3"></div>
      </div>
    </div>

    <div class="input-group">
      <label>Confirmar senha</label>
      <div class="input-wrapper">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>

  `;
}

function togglePwd() {
  const p = document.getElementById('inp-pwd');
  p.type = p.type === 'password' ? 'text' : 'password';
}

function checkStrength(val) {
  state.data.password = val;
  const b1 = document.getElementById('bar-1');
  const b2 = document.getElementById('bar-2');
  const b3 = document.getElementById('bar-3');
  
  b1.className = 'strength-bar'; b2.className = 'strength-bar'; b3.className = 'strength-bar';
  
  if (val.length === 0) return;
  
  let score = 0;
  if (val.length >= 8) score++;
  if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
  if (/[0-9]/.test(val) && /[^A-Za-z0-9]/.test(val)) score++;

  if (score === 1) { b1.classList.add('active', 'weak'); }
  else if (score === 2) { b1.classList.add('active', 'medium'); b2.classList.add('active', 'medium'); }
  else if (score === 3) { b1.classList.add('active', 'strong'); b2.classList.add('active', 'strong'); b3.classList.add('active', 'strong'); }
}

/* ============================================================
   VALIDAÇÕES GERAIS E SUBMIT
   ============================================================ */
function validateCurrentStep() {
  const config = stepsConfig[state.step];
  let isValid = true;

  if (config.id === 'personal') {
    if (state.data.name.trim().split(' ').length < 2) { showErr('err-name'); isValid = false; }
    if (state.data.cpf.length !== 14) { showErr('err-cpf'); isValid = false; }
    if (!state.data.birthdate) { showErr('err-birth'); isValid = false; }
    else {
      const age = new Date().getFullYear() - new Date(state.data.birthdate).getFullYear();
      if (age < 18) { showErr('err-birth'); isValid = false; }
    }
  }

  if (config.id === 'contact') {
    if (!state.data.email.includes('@')) { showErr('err-email'); isValid = false; }
    if (state.data.ddd.length < 2 || state.data.phone.length < 8) { showErr('err-phone'); isValid = false; }
  }

  if (config.id === 'address') {
    if (state.data.cep.replace(/\D/g,'').length !== 8) { showErr('err-cep'); isValid = false; }
  }

  if (config.id === 'document') {
    if (!state.data.docFront) { alert('Envie a frente do documento.'); isValid = false; }
  }

  if (config.id === 'selfie') {
    if (!state.data.selfie) { alert('Tire a selfie para continuar.'); isValid = false; }
  }

  if (config.id === 'password') {
    const pwd = document.getElementById('inp-pwd').value;
    const confirm = document.getElementById('inp-pwd-confirm').value;
    if (pwd.length < 8) { alert('A senha deve ter no mínimo 8 caracteres.'); isValid = false; }
    if (pwd !== confirm) { showErr('err-pwd'); isValid = false; }
  }

  if (config.id === 'review') {
    if (!state.data.terms) { showErr('err-terms'); isValid = false; }
  }

  return isValid;
}

function showErr(id) {
  const el = document.getElementById(id);
  if (el) el.style.display = 'block';
  // Limpa erro após 3s
  setTimeout(() => { if (el) el.style.display = 'none'; }, 3000);
}

/* ============================================================
   SUCESSO
   ============================================================ */
function submitApplication() {
  const btn = document.getElementById('btn-submit');
  btn.innerHTML = '<div style="width:20px;height:20px;border:3px solid white;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;"></div>';
  btn.disabled = true;

  // Simula requisição ao backend
  setTimeout(() => {
    const protocol = 'NX-' + Math.random().toString(36).substring(2, 8).toUpperCase();
    document.getElementById('app-header').classList.add('hidden');
    
    const c = document.getElementById('app-content');
    c.innerHTML = `
      <div class="success-screen pop-in">
        <div class="check-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        </div>

        <p class="subtitle" style="margin-bottom:24px;">Sua conta está em análise. Avisaremos quando estiver aprovada.</p>
        
        <div class="protocol-badge">${protocol}</div>
        <p style="font-size:12px; color:var(--text-mute);">Guarde este número de protocolo.</p>
        
        <button class="btn btn-outline" style="margin-top:auto; width:100%;" onclick="location.reload()">Voltar ao início</button>
      </div>
    `;
  }, 2000);
}
